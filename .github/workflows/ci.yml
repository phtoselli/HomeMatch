name: CI

on:
  push:
    branches: [main]
  pull_request:

# The GitHub Actions token only reads the code (CI publishes nothing and does not comment on PRs).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependencies without known vulnerabilities (production, high level)
        run: npm audit --omit=dev --audit-level=high
      - name: Formatting
        run: npm run format:check
      - name: Lint (includes the architecture import rules)
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: App build
        run: npm run build
