name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token do GitHub Actions só lê o código (o CI não publica nada nem comenta em PRs).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependências sem vulnerabilidade conhecida (produção, nível alto)
        run: npm audit --omit=dev --audit-level=high
      - name: Formatação
        run: npm run format:check
      - name: Lint (inclui as regras de dependência entre pacotes)
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build do app
        run: npm run build
